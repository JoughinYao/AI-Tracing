services:
  api:
    image: python:3.11-slim
    working_dir: /workspace/apps/api
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////workspace/apps/api/ai_tracing.db
      CRAWLER_BASE_URL: http://crawler-backend:8001
      FRONTEND_ORIGIN: http://localhost:5173

  web:
    image: node:20-alpine
    working_dir: /workspace/apps/web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/workspace
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: ""
