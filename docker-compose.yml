services:
  api:
    image: python:3.11-slim
    working_dir: /workspace/apps/api
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8100"
    volumes:
      - .:/workspace
    ports:
      - "8100:8100"
    environment:
      DATABASE_URL: sqlite:////workspace/apps/api/ai_tracing.db
      CRAWLER_BASE_URL: http://crawler-backend:8101
      FRONTEND_ORIGIN: http://localhost:5174

  web:
    image: node:20-alpine
    working_dir: /workspace/apps/web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    volumes:
      - .:/workspace
    ports:
      - "5174:5174"
    environment:
      VITE_API_BASE: ""
